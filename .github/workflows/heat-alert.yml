name: 오늘도 덥습니다

on:
  schedule:
    # 평일(월~금) 아침 7시(KST) 예정. 22:00 UTC + 9h = 다음 날 07:00 KST.
    # UTC 기준으로는 전날이므로 요일도 하루 앞당겨야 한다(월~금 -> 일~목 = 0-4).
    #
    # 왜 7시인가: GitHub 예약 실행은 크게 밀린다. 실측으로 2시간 20분 지연을
    # 확인해(예정 00:00 UTC -> 실제 02:20 UTC) 9시 도착을 노리고 2시간 앞당겼다.
    # 지연 폭은 매일 다르므로 보장이 아니라 보정이다. 안 밀리면 7시에 그냥 온다.
    - cron: "0 22 * * 0-4"
  workflow_dispatch:
    inputs:
      mode:
        description: "실행 모드"
        type: choice
        default: dry-run
        options:
          - dry-run # 감지만 하고 전송하지 않음
          - send # 실제 발송 (오늘 이미 보냈으면 건너뜀)
          - send-force # 오늘 이미 보냈어도 다시 발송
          - probe # 특보 목록 원본 확인 (파싱이 의심될 때)
          - probe-msg # 특보 통보문 본문 확인 (지역 상세)
          - probe-fcst # 단기예보 원본 확인 (제공 항목)

concurrency:
  group: heat-alert
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 중복 발송 방지용 state 파일 커밋
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 특보 감지 및 발송
        env:
          KMA_SERVICE_KEY: ${{ secrets.KMA_SERVICE_KEY }}
          MM_WEBHOOK_URL: ${{ secrets.MM_WEBHOOK_URL }}
          TZ: Asia/Seoul
        # 스케줄 실행에는 inputs가 없으므로 기본값 send로 떨어진다.
        run: |
          case "${{ inputs.mode || 'send' }}" in
            probe)       python probe.py warn ;;
            probe-msg)   python probe.py msg ;;
            probe-fcst)  python probe.py forecast ;;
            dry-run)     python main.py --dry-run ;;
            send-force)  python main.py --force ;;
            *)           python main.py ;;
          esac

      - name: 발송 기록 커밋
        if: ${{ (inputs.mode || 'send') == 'send' }}
        run: |
          if git diff --quiet -- state/sent.json; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name "heat-alert-bot"
          git config user.email "actions@github.com"
          git add state/sent.json
          git commit -m "chore: 발송 기록 갱신 [skip ci]"
          git push
